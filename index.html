<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hey...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* VOICE: terno, íntimo, um presente para uma pessoa só.
   IDEA: um baú antigo, numa sala vintage ao entardecer, que guarda o universo dentro.
   PICTURE: o baú de madeira escura e ornamentos dourados, no chão com pergaminhos, com feixes de luz da janela caindo nele.
   COLOUR and TYPE: golden hour: âmbar, madeira, bordô; depois céu índigo com névoas roxas. Pinyon Script e IM Fell English.
   LAYOUT: baú no centro; aberto, ele desce, o texto fica no alto e Órion no meio. */
:root{color-scheme:light;--sky:#070614;--ink:#fff7e6;--serif:"IM Fell English",Georgia,"Times New Roman",serif;--script:"Pinyon Script","Snell Roundhand",cursive,Georgia,serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;-webkit-text-size-adjust:100%}
@supports (height:100dvh){html,body{height:100dvh}}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#2a1a0e;overflow:hidden;font:16px/1.5 var(--serif)}

/* sala */
#room{position:fixed;inset:0;z-index:0;background:#3a2410 center bottom/cover no-repeat}
#room svg,#dust{position:absolute;inset:0;width:100%;height:100%;display:block}
#gold{position:absolute;inset:0;pointer-events:none}
.beams{mix-blend-mode:screen;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.78}}

#cosmos{position:fixed;inset:0;z-index:1;background:
 radial-gradient(ellipse 60% 45% at 25% 30%,rgba(120,60,190,.32),transparent 70%),
 radial-gradient(ellipse 55% 40% at 78% 62%,rgba(60,80,200,.28),transparent 70%),
 radial-gradient(ellipse 40% 35% at 55% 85%,rgba(190,70,160,.18),transparent 70%),
 var(--sky);
 -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0,transparent 0);mask-image:radial-gradient(circle at 50% 50%,#000 0,transparent 0)}
#cosmos canvas{position:absolute;inset:0;width:100%;height:100%}

/* baú */
#chest{position:fixed;left:50%;top:var(--cy,50%);width:var(--cw,min(72vw,340px));aspect-ratio:700/550;transform:translate(-50%,-50%);transition:transform 1.3s cubic-bezier(.65,0,.35,1);z-index:5}
body.down #chest{transform:translate(-50%,-50%) translateY(var(--dy,0px)) scale(var(--ds,.52))}
#chest img,#chest .part{position:absolute;left:0;width:100%;display:block;user-select:none;-webkit-user-drag:none}
#lidClosed{top:0;height:43.45%}
#bodyImg{top:43.45%;height:56.55%}
#lidOpen{left:2%!important;width:96%!important;bottom:55.5%;height:58%;filter:drop-shadow(0 -6px 14px rgba(150,110,255,.35))}
#lidClosed,#lidOpen{transform-origin:50% 100%;transition:transform .38s ease-in}
#lidOpen{transform:perspective(520px) rotateX(32deg) scaleY(0)}
body.lidup #lidClosed{transform:scaleY(0)}
body.lidup #lidOpen{transform:perspective(520px) rotateX(32deg) scaleY(1);transition:transform .5s .36s cubic-bezier(.2,.9,.3,1.15)}
#glow{position:absolute;left:-35%;width:170%;top:-35%;height:120%;background:radial-gradient(ellipse 50% 50% at 50% 70%,rgba(180,140,255,.55),rgba(123,75,214,.22) 45%,transparent 72%);opacity:0;transition:opacity .9s .5s;pointer-events:none}
#mouthGlow{position:absolute;left:4%;width:92%;top:40%;height:6%;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#fff4d8,#b89cff 45%,rgba(70,30,150,0) 72%);filter:blur(2px);opacity:0;transition:opacity .9s .5s}
body.lidup #glow,body.lidup #mouthGlow{opacity:1}
#mouth{position:absolute;left:8%;width:84%;top:42.5%;height:2%}
#shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,214,140,.55) 5%,rgba(255,190,110,.18) 45%,rgba(0,0,0,0) 70%);mix-blend-mode:screen;
 -webkit-mask-image:var(--mLid),var(--mBody);mask-image:var(--mLid),var(--mBody);
 -webkit-mask-size:100% 43.45%,100% 56.55%;mask-size:100% 43.45%,100% 56.55%;
 -webkit-mask-position:0 0,0 100%;mask-position:0 0,0 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;transition:opacity 1s}
body.lidup #shine{opacity:0}
#ringSvg{position:absolute;left:50%;top:77.5%;width:10%;margin-left:-5%;overflow:visible}
#ring{transform-box:fill-box;transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
body.pulled #ring{animation:none;transform:translateY(9px);opacity:0;transition:transform .3s ease-in,opacity .3s .15s}
#pull{position:absolute;left:37%;top:28%;width:26%;height:66%;border:0;background:none;cursor:pointer;border-radius:12px}
#pull:focus-visible{outline:2px dashed #f3d48a;outline-offset:2px}
body.open #pull{display:none}
#hint0{position:fixed;left:0;right:0;top:calc(50% + 150px);margin:0;text-align:center;font:italic 19px/1.3 var(--serif);color:#fbe9c4;text-shadow:0 1px 8px rgba(30,12,0,.85),0 0 2px rgba(0,0,0,.6);z-index:4;transition:opacity .4s}
body.pulled #hint0{opacity:0}

#msg{position:fixed;left:50%;top:calc(var(--sat) + clamp(16px,6vh,72px));width:min(100vw,640px);padding:0 24px;transform:translateX(-50%);text-align:center;color:var(--ink);opacity:0;transition:opacity 1.6s;pointer-events:none;z-index:3}
#msg h1{margin:0 0 18px;font:400 clamp(44px,11vw,76px)/1.05 var(--script);text-shadow:0 0 24px rgba(180,150,255,.7)}
#msg p{margin:0 auto 12px;max-width:30em;font:italic 400 clamp(18px,4.6vw,23px)/1.6 var(--serif);text-wrap:pretty}
#msg .sig{margin:20px 0 0;font:400 clamp(28px,7vw,38px)/1 var(--script)}
#msg .tip{margin:14px auto 0;font:italic 16px/1.3 var(--serif);opacity:.6}
body.reveal #msg{opacity:1}

#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#lines line{stroke:rgba(205,210,255,.2);stroke-width:1;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);transition:stroke-dashoffset 2.2s ease}
body.lines #lines line{stroke-dashoffset:0}
#sky{position:fixed;inset:0;z-index:6;pointer-events:none}
.star{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;padding:0;background:none;cursor:pointer;pointer-events:auto;opacity:0;transition:opacity 1.2s}
.star.in{opacity:1}
.star::before{content:"";position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:var(--c,#fff);box-shadow:0 0 6px 1px rgba(255,255,255,.55)}
.star::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--s)*4);height:calc(var(--s)*4);margin:calc(var(--s)*-2) 0 0 calc(var(--s)*-2);border-radius:50%;background:radial-gradient(circle,rgba(220,215,255,.3),transparent 70%);opacity:.35;animation:pulse 4.5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes pulse{50%{opacity:.75;transform:scale(1.15)}}
.star.seen::before{box-shadow:0 0 9px 2px rgba(255,250,235,.75)}
.star.seen::after{opacity:.6}
.star:focus-visible{outline:1px dashed rgba(255,255,255,.5);border-radius:50%}
.frase{position:absolute;width:max-content;max-width:min(78vw,320px);text-align:center;font:400 clamp(24px,5.5vw,32px)/1.1 var(--script);color:var(--ink);text-shadow:0 0 14px rgba(190,160,255,.9),0 0 3px rgba(0,0,0,.5);opacity:0;transform:translateY(5px);filter:blur(1px);transition:opacity .9s ease,transform .9s ease,filter .9s ease;pointer-events:none}
.frase.on{opacity:.95;transform:none;filter:none}
.frase.out{opacity:0;transform:translateY(-8px);filter:blur(2px);transition-duration:1.1s}

#close{position:fixed;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);z-index:7;min-height:44px;padding:0 22px;border-radius:22px;border:1px solid rgba(255,247,230,.4);background:rgba(10,8,30,.35);color:var(--ink);font:italic 18px var(--serif);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#close:hover{background:rgba(40,30,80,.5)}
#close:focus-visible{outline:2px solid rgba(230,220,255,.7);outline-offset:2px}
body.reveal #close{opacity:1;pointer-events:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:600px){
 #msg{padding:0 18px;top:calc(var(--sat) + max(14px,4vh))}
 #msg h1{font-size:clamp(40px,12vw,64px);margin-bottom:10px}
 #msg p{font-size:clamp(16px,4.4vw,20px);line-height:1.42;margin-bottom:8px}
 #msg .sig{font-size:clamp(27px,7vw,34px);margin-top:10px}
 #msg .tip{font-size:13px;margin-top:8px}
 #hint0{font-size:17px}
 #close{font-size:16px}
 .frase{max-width:82vw;font-size:clamp(23px,6vw,30px)}
}
@media (max-height:740px){
 #msg h1{font-size:clamp(34px,10vw,52px);margin-bottom:6px}
 #msg p{font-size:clamp(15px,4.1vw,18px);line-height:1.32;margin-bottom:5px}
 #msg .sig{font-size:26px;margin-top:6px}
 #msg .tip{margin-top:5px}
}
@media (prefers-reduced-motion:reduce){#ring,.star::after,.beams{animation:none}}
</style>
</head>
<body>
<div id="sabProbe" style="position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden"></div>
<div id="room" aria-hidden="true"><svg id="roomSvg"></svg><canvas id="dust"></canvas><div id="gold"></div></div>
<div id="cosmos" aria-hidden="true"><canvas id="cv"></canvas></div>
<svg id="lines" aria-hidden="true"></svg>

<div id="msg" aria-live="polite">
  <h1 id="t-title"></h1>
  <p id="t-l1"></p>
  <p id="t-l2"></p>
  <p class="sig" id="t-sig"></p>
  <p class="tip">Toque nas estrelas de Órion e nas que brilham ao redor.</p>
</div>

<div id="sky"></div>

<div id="chest">
  <div id="glow"></div>
  <img id="lidOpen" alt="">
  <img id="bodyImg" alt="">
  <div id="mouthGlow"></div>
  <div id="mouth"></div>
  <img id="lidClosed" alt="">
  <div id="shine"></div>
  <svg id="ringSvg" viewBox="0 0 40 52" aria-hidden="true">
    <defs><linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8c"/><stop offset=".5" stop-color="#c49a45"/><stop offset="1" stop-color="#6e4b17"/></linearGradient></defs>
    <g id="ring">
      <path d="M14 3 Q20 -2 26 3 L24 10 H16 Z" fill="url(#gold1)" stroke="#5a3d12" stroke-width=".8"/>
      <circle cx="20" cy="9" r="2.6" fill="#e9c874" stroke="#5a3d12" stroke-width=".6"/>
      <circle cx="20" cy="29" r="15" fill="none" stroke="url(#gold1)" stroke-width="5"/>
      <circle cx="20" cy="29" r="15" fill="none" stroke="#4a320e" stroke-width=".7" opacity=".6"/>
      <path d="M9 22 A13 13 0 0 1 20 15" fill="none" stroke="#fff0bf" stroke-width="1.2" opacity=".7"/>
    </g>
  </svg>
  <button id="pull" aria-label="Puxar o anel e abrir o baú"></button>
</div>
<p id="hint0">Puxe o anel para abrir</p>

<button id="close">Fechar o baú</button>
<div class="sr" id="live" aria-live="polite"></div>

let seed = 3;

const scroll = (x, y, len, ang, r) => {
  const e = r * .5;
  return `<g transform="translate(${x} ${y}) rotate(${ang})">
    <ellipse cx="0" cy="${r * 1.1}" rx="${len * .55}" ry="${r * .5}" fill="#1a0b03" opacity=".45" filter="url(#soft)"/>
    <rect x="${-len / 2}" y="${-r}" width="${len}" height="${2 * r}" rx="${e}" fill="url(#parch)"/>
    <path d="M${-len / 2 + e} ${-r * .35} H${len / 2 - e}" stroke="#fff3d0" stroke-opacity=".5" stroke-width="${r * .25}"/>
    <ellipse cx="${len / 2 - e * .2}" cy="0" rx="${e}" ry="${r}" fill="#e9d3a0" stroke="#9a7340" stroke-width=".8"/>
    <path d="M${len / 2 - e * .2} ${-r * .55} a${e * .55} ${r * .55} 0 1 1 -.1 0 M${len / 2 - e * .2} ${-r * .25} a${e * .25} ${r * .25} 0 1 1 -.1 0" fill="none" stroke="#9a7340" stroke-width=".7"/>
    <rect x="${-r * .5}" y="${-r - .5}" width="${r}" height="${2 * r + 1}" fill="#7d1f1a"/>
    <path d="M${r * .2} ${r} q${r * .5} ${r * 1.1} ${r * 1.3} ${r * 1.2}" stroke="#7d1f1a" stroke-width="${r * .35}" fill="none"/>
  </g>`;
};
const sheet = (x, y, w, ang) => {
  const h = w * .42, r = w * .07;
  let lines = "";
  for (let i = 0; i < 5; i++) { const yy = -h / 2 + h * (.22 + i * .14); lines += `<path d="M${-w * .3} ${yy} q${w * .15} ${-2} ${w * .3} 0 t${w * .28} 0" stroke="#6b4a26" stroke-opacity=".38" stroke-width="1" fill="none"/>`; }
  return `<g transform="translate(${x} ${y}) rotate(${ang}) scale(1 .55)">
    <ellipse cx="0" cy="${h * .2}" rx="${w * .55}" ry="${h * .6}" fill="#1a0b03" opacity=".35" filter="url(#soft)"/>
    <path d="M${-w / 2} ${-h / 2} Q0 ${-h / 2 - 6} ${w / 2} ${-h / 2} L${w / 2} ${h / 2} Q0 ${h / 2 + 6} ${-w / 2} ${h / 2} Z" fill="url(#parch2)"/>
    ${lines}

    <rect x="${w / 2 - r}" y="${-h / 2 - 2}" width="${2 * r}" height="${h + 4}" rx="${r}" fill="url(#parchV)"/>
  </g>`;
};
const drawRoom = () => {

  const cy = base - ch / 2, top = base - ch;
  const small = H <= 740, ds = small ? .44 : .52, off = small ? 66 : 74;

    <linearGradient id="parchV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a7834c"/><stop offset=".4" stop-color="#f1dcaa"/><stop offset="1" stop-color="#8f6a37"/></linearGradient>
    <linearGradient id="parch2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e1b4"/><stop offset="1" stop-color="#c9a468"/></linearGradient>
    <radialGradient id="pool"><stop offset="0" stop-color="#ffd27a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <ellipse cx="${cx}" cy="${base - 6}" rx="${cw * .85}" ry="${cw * .12}" fill="url(#pool)"/>
  <ellipse cx="${cx}" cy="${base - 3}" rx="${cw * .5}" ry="${cw * .045}" fill="#120602" opacity=".75" filter="url(#soft)"/>
  ${items}`;
  $("gold").style.background = "linear-gradient(170deg, rgba(255,170,60,.08), rgba(60,20,0,.18)), radial-gradient(ellipse 115% 85% at 50% 50%, transparent 55%, rgba(25,10,0,.5))";
  $("hint0").style.top = (base + 14) + "px";
  beamPolys = [[[0, 0], [W, 0], [W, H], [0, H]]];
};

/* poeira dourada nos feixes */
const dc = $("dust"), dx = dc.getContext("2d");
let motes = [];
const inPoly = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { if ((p[i][1] > y) !== (p[j][1] > y) && x < (p[j][0] - p[i][0]) * (y - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) c = !c; } return c; };
const sizeDust = () => {
  const r = Math.min(devicePixelRatio || 1, 2); dc.width = innerWidth * r; dc.height = innerHeight * r; dx.setTransform(r, 0, 0, r, 0, 0);
  motes = Array.from({length: 45}, () => ({x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.3 + .3, vx: (Math.random() - .3) * .12, vy: (Math.random() - .5) * .1, p: Math.random() * 6.28}));
};
const dustLoop = () => {
  if (!B.classList.contains("open")) {
    dx.clearRect(0, 0, innerWidth, innerHeight);
    for (const m of motes) {
      if (!reduce) { m.x += m.vx; m.y += m.vy + Math.sin(m.p += .01) * .05; if (m.x > innerWidth) m.x = 0; if (m.x < 0) m.x = innerWidth; if (m.y > innerHeight) m.y = 0; if (m.y < 0) m.y = innerHeight; }
      if (!beamPolys.some(p => inPoly(m.x, m.y, p))) continue;
      dx.globalAlpha = .18 + .3 * Math.abs(Math.sin(m.p * 3)); dx.fillStyle = "#ffe6b0";
      dx.beginPath(); dx.arc(m.x, m.y, m.r, 0, 6.283); dx.fill();
    }
  }
  requestAnimationFrame(dustLoop);
};

/* ---- starfield ---- */
const cv = $("cv"), cx = cv.getContext("2d");
let W = 0, H = 0, dots = [];
const size = () => {
  const r = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * r; cv.height = H * r; cx.setTransform(r, 0, 0, r, 0, 0);
  const n = Math.round(Math.min(320, W * H / 3500));
  dots = Array.from({length: n}, () => ({x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + .25, p: Math.random() * 6.28, v: Math.random() * .12 + .03, s: Math.random() * .02 + .006}));
};
const paint = () => {
  if (B.classList.contains("open")) {
    cx.clearRect(0, 0, W, H);
    for (const d of dots) {
      d.p += d.s; if (!reduce) { d.y -= d.v; if (d.y < -2) { d.y = H + 2; d.x = Math.random() * W; } }
      cx.globalAlpha = .35 + .65 * (.5 + .5 * Math.sin(d.p));
      cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(d.x, d.y, d.r, 0, 6.283); cx.fill();
    }
  }
  requestAnimationFrame(paint);
};
drawRoom(); sizeDust(); size(); paint(); dustLoop();

/* ---- universo saindo do baú ---- */
const cos = $("cosmos"), mouth = $("mouth");
let rad = 0, maskLoop = null;
const setMask = (x, y, r) => {
  const soft = Math.max(60, r * .35);
  const m = r <= 0 ? "radial-gradient(circle at 50% 50%,#000 0,transparent 0)"
    : `radial-gradient(circle at ${x}px ${y}px,#000 ${Math.max(0, r - soft)}px,transparent ${r}px)`;
  cos.style.webkitMaskImage = m; cos.style.maskImage = m;
};
const animRad = (to, ms, done) => {
  cancelAnimationFrame(maskLoop);
  const from = rad, t0 = performance.now();
  const ease = t => t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2;
  const step = now => {
    const t = Math.min(1, (now - t0) / ms);
    rad = from + (to - from) * ease(t);
    const b = mouth.getBoundingClientRect();
    setMask(b.left + b.width / 2, b.top + b.height / 2, rad);
    if (t < 1) maskLoop = requestAnimationFrame(step);
    else { if (to > 0) { cos.style.webkitMaskImage = "none"; cos.style.maskImage = "none"; } done && done(); }
  };
  maskLoop = requestAnimationFrame(step);
};
const fullR = () => Math.hypot(innerWidth, innerHeight) * 1.25;

/* ---- estrelas ---- */
const ORION = [[.22,.06,"rgb(255,205,160)",9],[.76,.13,"rgb(215,230,255)",8],[.39,.5,"#fff7e6",8],[.5,.465,"#fff7e6",8],[.61,.43,"#fff7e6",8],[.3,.92,"#fff7e6",7],[.8,.86,"rgb(200,220,255)",9]];
const LINKS = [[0,1],[0,2],[1,4],[2,3],[3,4],[2,5],[4,6]];
const sky = $("sky"), lines = $("lines"), live = $("live");
let current = null, fadeTimer = null;

const showPhrase = (btn, text) => {
  if (current) { const old = current; old.classList.remove("on"); old.classList.add("out"); setTimeout(() => old.remove(), 1200); }
  clearTimeout(fadeTimer);
  const f = document.createElement("div");
  f.className = "frase"; f.textContent = text;
  sky.appendChild(f);
  const x = parseFloat(btn.style.left), y = parseFloat(btn.style.top), w = f.offsetWidth, h = f.offsetHeight;
  const vw = innerWidth, vh = (window.visualViewport && visualViewport.height) || innerHeight;
  let l = Math.max(12, Math.min(vw - w - 12, x - w / 2));
  let t = y - 16 - h;
  if (t < 12) t = y + 16;
  t = Math.min(t, vh - h - 12);
  const mr = $("msg").getBoundingClientRect();
  if (t < mr.bottom + 4 && l < mr.right && l + w > mr.left) t = Math.max(t, y + 16);
  const c = $("chest").getBoundingClientRect();
  if (l < c.right && l + w > c.left && t < c.bottom && t + h > c.top) {
    if (x < c.left + c.width / 2 && c.left - w - 8 >= 12) l = c.left - w - 8;
    else if (x >= c.left + c.width / 2 && c.right + w + 8 <= vw - 12) l = c.right + 8;
    else t = Math.max(12, c.top - h - 10);
  }
  f.style.left = l + "px"; f.style.top = t + "px";
  requestAnimationFrame(() => requestAnimationFrame(() => f.classList.add("on")));
  current = f; live.textContent = text;
  fadeTimer = setTimeout(() => { if (current === f) { f.classList.remove("on"); f.classList.add("out"); setTimeout(() => f.remove(), 1200); current = null; } }, 4500);
};

const makeStar = (x, y, s, c, text, i) => {
  const b = document.createElement("button");
  b.className = "star"; b.style.left = x + "px"; b.style.top = y + "px";
  b.style.setProperty("--s", s + "px"); b.style.setProperty("--c", c); b.style.setProperty("--d", (-i * .7) + "s");
  b.setAttribute("aria-label", "Estrela " + (i + 1));
  b.addEventListener("click", () => { b.classList.add("seen"); showPhrase(b, text); });
  sky.appendChild(b);
  return b;
};

let rng = 7;
const rand = () => (rng = (rng * 16807) % 2147483647) / 2147483647;

const layout = () => {
  sky.innerHTML = ""; current = null; lines.innerHTML = "";
  const w = innerWidth, h = innerHeight;
  lines.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const tr = $("msg").getBoundingClientRect(), ch = $("chest").getBoundingClientRect(), bt = $("close").getBoundingClientRect();
  const top = tr.bottom + 18, bottom = ch.top - 14, avail = Math.max(130, bottom - top);
  const bw = Math.min(w * .72, 400), bh = Math.min(avail, bw * 1.2), bwFit = Math.min(bw, bh / 1.05);
  const ox = (w - bwFit) / 2, oy = top + (avail - bh) / 2;
  const pos = ORION.map(([fx, fy]) => [ox + fx * bwFit, oy + fy * bh]);
  lines.innerHTML = LINKS.map(([a, b]) => {
    const [x1, y1] = pos[a], [x2, y2] = pos[b], l = Math.hypot(x2 - x1, y2 - y1);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="--l:${l}"/>`;
  }).join("");
  const placed = [];
  ORION.forEach(([, , c, s], i) => { placed.push(pos[i]); makeStar(pos[i][0], pos[i][1], s, c, MOTIVOS_ORION[i] || "", i); });
  const pad = (r, p) => ({l: r.left - p, r: r.right + p, t: r.top - p, b: r.bottom + p});
  const zones = [pad(tr, 8), {l: ox - 24, r: ox + bwFit + 24, t: oy - 24, b: oy + bh + 24}, pad(ch, 10), pad(bt, 10)];
  const inZone = (x, y) => zones.some(z => x > z.l && x < z.r && y > z.t && y < z.b);
  const gap = Math.min(56, Math.max(40, Math.sqrt(w * h / 60)));
  rng = 7;
  MOTIVOS.forEach((m, i) => {
    for (let k = 0; k < 2500; k++) {
      const x = 22 + rand() * (w - 44), y = 22 + rand() * (h - 44);
      if (inZone(x, y) || placed.some(([px, py]) => Math.hypot(px - x, py - y) < gap)) continue;
      placed.push([x, y]); makeStar(x, y, 4.5, "#fff7e6", m, i + 7); return;
    }
  });
  const btns = [...sky.children];
  btns.forEach((b, i) => {
    let d = 44;
    placed.forEach((q, j) => { if (j !== i) d = Math.min(d, Math.hypot(q[0] - placed[i][0], q[1] - placed[i][1])); });
    const z = Math.max(22, Math.min(44, d - 2));
    b.style.width = b.style.height = z + "px"; b.style.margin = (-z / 2) + "px 0 0 " + (-z / 2) + "px";
  });
  btns.forEach((s, i) => setTimeout(() => s.classList.add("in"), reduce ? 0 : 120 * i));
};

/* ---- abrir / fechar ---- */
let busy = false;
const T = ms => reduce ? Math.min(ms, 200) : ms;
$("pull").addEventListener("click", () => {
  if (busy || B.classList.contains("open")) return; busy = true;
  B.classList.add("pulled");
  setTimeout(() => B.classList.add("lidup"), T(320));
  setTimeout(() => { B.classList.add("open"); animRad(fullR(), T(2000)); }, T(900));
  setTimeout(() => B.classList.add("down"), T(1700));
  setTimeout(() => { B.classList.add("reveal"); }, T(3100));
  setTimeout(() => { layout(); B.classList.add("lines"); busy = false; $("close").focus({preventScroll: true}); }, T(3500));
});
$("close").addEventListener("click", () => {
  if (busy) return; busy = true;
  clearTimeout(fadeTimer);
  [...sky.children].forEach(s => s.classList.remove("in", "on"));
  B.classList.remove("reveal", "lines");
  setTimeout(() => { sky.innerHTML = ""; current = null; B.classList.remove("down", "open"); rad = fullR(); animRad(0, T(1700)); }, T(700));
  setTimeout(() => B.classList.remove("lidup"), T(2300));
  setTimeout(() => { B.classList.remove("pulled"); busy = false; $("pull").focus({preventScroll: true}); }, T(3000));
});

let rt;
addEventListener("resize", () => {
  size(); sizeDust(); drawRoom(); clearTimeout(rt);
  rt = setTimeout(() => { if (B.classList.contains("lines") && !busy) layout(); }, 1400);
});
}
</script>
</body>
